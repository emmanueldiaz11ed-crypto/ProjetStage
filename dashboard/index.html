<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dashboard Analyse Academique</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { font-family: 'Inter', sans-serif; }

        .dark { background-color: #1a1a1a; color: #ffffff; }
        .dark .bg-white       { background-color: #2d2d2d !important; }
        .dark .bg-gray-50     { background-color: #2d2d2d !important; }
        .dark .bg-gray-100    { background-color: #3d3d3d !important; }
        .dark .bg-gray-700    { background-color: #4d4d4d !important; }
        .dark .bg-gray-800    { background-color: #1f2937 !important; }
        .dark .bg-blue-100    { background-color: #1e3a5f !important; }
        .dark .bg-red-100     { background-color: #3a1e1e !important; }
        .dark .bg-orange-100  { background-color: #3a2a1e !important; }
        .dark .bg-green-100   { background-color: #1e3a2f !important; }
        .dark .border         { border-color: #4d4d4d !important; }
        .dark .text-gray-300  { color: #d1d5db !important; }
        .dark .text-gray-600  { color: #9ca3af !important; }
        .dark input, .dark select { background-color: #3d3d3d !important; color: #ffffff !important; border-color: #4d4d4d !important; }
    </style>
</head>

<body class="bg-gray-50 flex h-screen overflow-hidden">

<!-- SIDEBAR -->
<aside id="sidebar" class="w-64 bg-white border-r p-6 overflow-y-auto fixed inset-y-0 left-0 z-50 md:static md:translate-x-0 -translate-x-full md:-translate-x-0 transition-transform duration-300">
    
    <!-- Header Sidebar -->
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-xl font-bold text-gray-800 dark:text-white">Dashboard</h1>
        <div class="flex gap-2">
            <button id="sidebar-toggle-btn" class="hidden md:block p-2 text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white" aria-label="Basculer sidebar">
                Hide
            </button>
            <button id="close-sidebar" class="md:hidden p-2 text-gray-600 hover:text-gray-900" aria-label="Fermer">
                X
            </button>
        </div>
    </div>

    <!-- Upload CSV -->
    <div class="mb-6 pb-6 border-b">
        <button id="csv-upload-btn" class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-semibold transition">
            Charger CSV
        </button>
        <input type="file" id="csv-file-input" accept=".csv" style="display: none;">
    </div>

    <!-- Navigation Analyses -->
    <nav class="mb-6">
        <h2 class="text-sm font-semibold text-gray-600 dark:text-gray-300 mb-3 px-2">Analyses</h2>
        <ul id="sidebar-analysis-list" class="space-y-1">
            <!-- Généré par JS -->
        </ul>
    </nav>

    <hr class="my-6 dark:border-gray-700">

    <!-- Section Recherche Etudiant -->
    <div>
        <h2 class="text-sm font-semibold text-gray-600 dark:text-gray-300 mb-3 px-2">Recherche Etudiant</h2>
        <div class="space-y-2">
            <label for="search-etudiant" class="sr-only">Rechercher un étudiant par anonymat ou carte</label>
            <input id="search-etudiant" type="text" placeholder="Anonymat ou Carte" 
                class="w-full border rounded-lg px-3 py-2 text-sm dark:bg-gray-700 dark:border-gray-600">
            <button id="btn-search-etudiant" class="w-full px-3 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-semibold transition">
                Chercher
            </button>
        </div>
        <div id="etudiant-details" class="mt-4 text-sm"></div>
    </div>

</aside>

<!-- Overlay Sidebar Mobile -->
<div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden md:hidden"></div>

<!-- MAIN CONTENT -->
<div class="flex-1 flex flex-col overflow-hidden">

    <!-- HEADER -->
    <header class="bg-white dark:bg-gray-800 border-b dark:border-gray-700 px-8 py-4 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <button id="menu-burger" class="md:hidden p-2 text-gray-600 hover:text-gray-900 dark:text-gray-400" aria-label="Menu">
                Menu
            </button>
            <h1 class="text-2xl font-bold text-gray-800 dark:text-white">Analyse Academique</h1>
        </div>
        <button id="theme-toggle-btn" class="p-2 text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white" aria-label="Basculer theme">
            <span id="theme-icon-light">Light</span>
            <span id="theme-icon-dark" class="hidden">Dark</span>
        </button>
    </header>

    <!-- ANALYSIS CONTENT -->
    <div class="flex-1 overflow-y-auto">
        
        <!-- Filtres Analyse -->
        <div id="analysis-filters" class="bg-gray-50 dark:bg-gray-800 border-b dark:border-gray-700 px-8 py-6">
            <!-- Générés par JS -->
        </div>

        <!-- Contenu Principal -->
        <main id="main-content" class="flex-1">
            <!-- Généré par JS -->
        </main>

    </div>

</div>

<script src="app.js" defer></script>

</body>
</html>
