# Exemple de Configuration Nginx Complète pour ProjetStage
# 
# INSTRUCTIONS D'INSTALLATION :
# 1. Copiez ce fichier vers : /etc/nginx/sites-available/projetstage.conf
#    Commande : sudo cp projetstage.conf /etc/nginx/sites-available/
# 
# 2. Créez un lien symbolique :
#    sudo ln -s /etc/nginx/sites-available/projetstage.conf /etc/nginx/sites-enabled/
# 
# 3. Testez la syntaxe :
#    sudo nginx -t
# 
# 4. Rechargez Nginx :
#    sudo systemctl reload nginx
#
# ═══════════════════════════════════════════════════════════════════════════

# ╔════════════════════════════════════════════════════════════════════════════╗
# ║                       CONFIGURATION HTTP (Port 80)                         ║
# ║                   Redirection automatique vers HTTPS                       ║
# ╚════════════════════════════════════════════════════════════════════════════╝

server {
    # Écoute les connexions HTTP sur le port 80 (non-sécurisé)
    listen 80;
    listen [::]:80;  # Supporte aussi IPv6
    
    # Remplacez par votre vrai domaine
    server_name votre_domaine.com www.votre_domaine.com;
    
    # ───────────────────────────────────────────────────────────────────────
    # REDIRECTION HTTP → HTTPS
    # ───────────────────────────────────────────────────────────────────────
    # Redirige TOUTES les requêtes HTTP vers HTTPS (sécurisé)
    # Les utilisateurs qui tapent http://votre_domaine.com sont redirigés
    # vers https://votre_domaine.com
    
    return 301 https://$server_name$request_uri;
}

# ╔════════════════════════════════════════════════════════════════════════════╗
# ║                      CONFIGURATION HTTPS (Port 443)                        ║
# ║                           SERVEUR PRINCIPAL                                ║
# ╚════════════════════════════════════════════════════════════════════════════╝

server {
    # ───────────────────────────────────────────────────────────────────────
    # 1. ÉCOUTE DU PORT
    # ───────────────────────────────────────────────────────────────────────
    # listen 443 ssl http2 : Écoute sur le port 443 (HTTPS) avec support SSL et HTTP/2
    # HTTP/2 est plus rapide que HTTP/1.1
    
    listen 443 ssl http2;
    listen [::]:443 ssl http2;  # IPv6
    
    # ───────────────────────────────────────────────────────────────────────
    # 2. NOM DU SERVEUR (DOMAINE)
    # ───────────────────────────────────────────────────────────────────────
    # Ces deux domaines accuseront les demandes pour ce bloc server
    
    server_name votre_domaine.com www.votre_domaine.com;
    
    # ───────────────────────────────────────────────────────────────────────
    # 3. CONFIGURATION SSL/TLS (CERTIFICAT)
    # ───────────────────────────────────────────────────────────────────────
    # Chemin vers le certificat SSL (obtenu avec Let's Encrypt / Certbot)
    # 
    # Les chemins par défaut pour certbot sont :
    #   /etc/letsencrypt/live/votre_domaine.com/fullchain.pem
    #   /etc/letsencrypt/live/votre_domaine.com/privkey.pem
    
    ssl_certificate /etc/letsencrypt/live/votre_domaine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/votre_domaine.com/privkey.pem;
    
    # Fichier OCSP stapling (vérifie l'état du certificat, améliore les perfs)
    # Optionnel mais recommandé
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/votre_domaine.com/chain.pem;
    
    # ───────────────────────────────────────────────────────────────────────
    # 4. PARAMÈTRES DE SÉCURITÉ SSL
    # ───────────────────────────────────────────────────────────────────────
    # Quelles versions de TLS sont autorisées
    # TLSv1.2 et TLSv1.3 sont sécurisés
    # TLSv1.0 et TLSv1.1 sont obsolètes et désactivés
    
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # Chiffres de chiffrement autorisés (ordre de préférence)
    # HIGH : chiffres forts
    # !aNULL : exclut les chiffres sans authentification
    # !MD5 : exclut le faible MD5
    
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    
    # Durée de vie de la session SSL en cache (performance)
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # ───────────────────────────────────────────────────────────────────────
    # 5. HEADERS DE SÉCURITÉ
    # ───────────────────────────────────────────────────────────────────────
    # Ces headers renforcent la sécurité du navigateur
    
    # Force HTTPS sur tous les futurs accès (1 an)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Empêche le clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Empêche la détection du type MIME
    add_header X-Content-Type-Options "nosniff" always;
    
    # Active la protection XSS du navigateur
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Politique de contenu (CSP) - à adapter selon votre app
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;
    
    # ───────────────────────────────────────────────────────────────────────
    # 6. LIMITE DE TAILLE DE FICHIER
    # ───────────────────────────────────────────────────────────────────────
    # Autorise les uploads jusqu'à 100 Mo
    # À adapter selon vos besoins
    
    client_max_body_size 100M;
    
    # ───────────────────────────────────────────────────────────────────────
    # 7. RACINE DES FICHIERS STATIQUES
    # ───────────────────────────────────────────────────────────────────────
    # Répertoire où se trouvent les fichiers statiques et uploadés
    # Utilisé en cas de non-correspondance avec les locations
    
    root /home/utilisateur/ProjetStage/data;
    
    # ───────────────────────────────────────────────────────────────────────
    # 8. INDEX PAR DÉFAUT
    # ───────────────────────────────────────────────────────────────────────
    # Fichier à servir si un répertoire est demandé
    
    index index.html index.htm;
    
    # ═══════════════════════════════════════════════════════════════════════
    # ░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░
    # ROUTAGE DES DEMANDES (location blocks)
    # ░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░
    # ═══════════════════════════════════════════════════════════════════════
    
    # ───────────────────────────────────────────────────────────────────────
    # BLOC 1 : FRONTEND NEXT.JS (à la racine /)
    # ───────────────────────────────────────────────────────────────────────
    # Toutes les requêtes à "/" (sauf les autres locations ci-dessous)
    # sont redirigées vers Next.js sur le port 3000
    
    location / {
        # proxy_pass : redirige vers le service backend
        # http://localhost:3000 : l'adresse du service Next.js
        proxy_pass http://localhost:3000;
        
        # Version HTTP (1.1 support les connexions persistantes et les upgrades)
        proxy_http_version 1.1;
        
        # Support des WebSockets (pour les connexions en temps réel)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Transmet le nom d'hôte original (important pour Next.js)
        proxy_set_header Host $host;
        
        # L'adresse IP réelle du client (pas celle de Nginx)
        proxy_set_header X-Real-IP $remote_addr;
        
        # Chaîne de proxy (tous les proxies traversés)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Protocole d'origine (http ou https)
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Évite les problèmes de cache (chaque client a sa réponse)
        proxy_cache_bypass $http_upgrade;
    }
    
    # ───────────────────────────────────────────────────────────────────────
    # BLOC 2 : API DJANGO (/api/*)
    # ───────────────────────────────────────────────────────────────────────
    # Toutes les URLs commençant par "/api/" sont redirigées vers Django
    # Exemples : /api/users/, /api/data/, /api/login/ → Django
    
    location /api/ {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # ───────────────────────────────────────────────────────────────────
        # TIMEOUTS (pour les requêtes qui prennent du temps)
        # ───────────────────────────────────────────────────────────────────
        # proxy_connect_timeout : délai pour établir la connexion à Django
        # proxy_send_timeout : délai pour envoyer les données à Django
        # proxy_read_timeout : délai pour recevoir la réponse de Django
        
        proxy_connect_timeout 60s;      # Délai de connexion
        proxy_send_timeout 60s;         # Délai d'envoi
        proxy_read_timeout 60s;         # Délai de réception
        
        # ───────────────────────────────────────────────────────────────────
        # BUFFERING (stockage temporaire des réponses)
        # ───────────────────────────────────────────────────────────────────
        # On par défaut pour les requêtes lentes
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
    
    # ───────────────────────────────────────────────────────────────────────
    # BLOC 3 : API FASTAPI (/analyze/*)
    # ───────────────────────────────────────────────────────────────────────
    # Toutes les URLs commençant par "/analyze/" vont vers FastAPI
    # Exemples : /analyze/data/, /analyze/report/ → FastAPI
    
    location /analyze/ {
        proxy_pass http://localhost:8001;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # ───────────────────────────────────────────────────────────────────
        # TIMEOUTS PLUS LONGS (les analyses peuvent prendre du temps)
        # ───────────────────────────────────────────────────────────────────
        # Les requêtes d'analyse peuvent durer plusieurs minutes
        
        proxy_connect_timeout 120s;     # Attente de connexion
        proxy_send_timeout 300s;        # Délai pour envoyer les données (5 min)
        proxy_read_timeout 300s;        # Délai pour recevoir (5 min)
        
        # Désactive le buffering pour les uploads volumineux
        proxy_request_buffering off;
    }
    
    # ───────────────────────────────────────────────────────────────────────
    # BLOC 4 : FICHIERS STATIQUES DE DJANGO (/static/*)
    # ───────────────────────────────────────────────────────────────────────
    # CSS, JS, images du admin Django
    # Ces fichiers sont servis directement par Nginx (plus rapide)
    # Le préfixe `/static/` est ôté du chemin
    
    location /static/ {
        # alias : le chemin réel des fichiers
        # /static/admin/css/base.css → /home/utilisateur/ProjetStage/data/django/staticfiles/admin/css/base.css
        alias /home/utilisateur/ProjetStage/data/django/staticfiles/;
        
        # ───────────────────────────────────────────────────────────────────
        # CACHE (les fichiers statiques changent rarement)
        # ───────────────────────────────────────────────────────────────────
        # expires 30d : le navigateur garde ces fichiers en cache 30 jours
        # Le navigateur ne re-télécharge pas si le cache n'a pas expiré
        
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # Enregistrement : pas besoin de logger chaque fichier statique (bruit)
        access_log off;
    }
    
    # ───────────────────────────────────────────────────────────────────────
    # BLOC 5 : FICHIERS UPLOADÉS (/media/*)
    # ───────────────────────────────────────────────────────────────────────
    # Photos, documents, fichiers téléchargés par les utilisateurs
    
    location /media/ {
        # alias : le chemin vers le dossier des uploads
        alias /home/utilisateur/ProjetStage/data/django/media/;
        
        # ───────────────────────────────────────────────────────────────────
        # CACHE (plus court que les fichiers statiques)
        # ───────────────────────────────────────────────────────────────────
        # expires 7d : cache de 7 jours (les uploads peuvent être modifiés)
        
        expires 7d;
        add_header Cache-Control "public";
        
        # Pas de logging
        access_log off;
    }
    
    # ───────────────────────────────────────────────────────────────────────
    # BLOC 6 : HEALTHCHECK (/health)
    # ───────────────────────────────────────────────────────────────────────
    # Point de terminaison utilisé par les moniteurs (Uptime Robot, etc.)
    # pour vérifier que le site est en ligne
    
    location /health {
        # Retourne "healthy" avec le statut 200 (OK)
        access_log off;  # Ne pas enregistrer ces vérifications
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # ───────────────────────────────────────────────────────────────────────
    # BLOC 7 : ROBOT.TXT (SEO)
    # ───────────────────────────────────────────────────────────────────────
    # Optionnel : si vous avez un robots.txt personnalisé
    
    # location = /robots.txt {
    #     alias /home/utilisateur/ProjetStage/public/robots.txt;
    #     access_log off;
    # }
    
    # ───────────────────────────────────────────────────────────────────────
    # BLOC 8 : FAVICON (petite icône du site)
    # ───────────────────────────────────────────────────────────────────────
    # Optionnel
    
    # location = /favicon.ico {
    #     alias /home/utilisateur/ProjetStage/public/favicon.ico;
    #     access_log off;
    #     expires 30d;
    # }
    
    # ═══════════════════════════════════════════════════════════════════════
    # GESTION DES ERREURS
    # ═══════════════════════════════════════════════════════════════════════
    
    # Page d'erreur personnalisée 404
    error_page 404 /404.html;
    
    # Page d'erreur personnalisée 500
    error_page 500 502 503 504 /50x.html;
    
    # ───────────────────────────────────────────────────────────────────────
    # LOGGING
    # ───────────────────────────────────────────────────────────────────────
    # Emplacement des logs pour ce site
    
    access_log /var/log/nginx/projetstage_access.log;
    error_log /var/log/nginx/projetstage_error.log;
}

# ═══════════════════════════════════════════════════════════════════════════
# NOTES ET CONSEILS
# ═══════════════════════════════════════════════════════════════════════════
#
# 1. REMPLACER LES PLACEHOLDERS :
#    - votre_domaine.com : votre vrai domaine
#    - /home/utilisateur/ProjetStage : chemin réel du projet
#
# 2. PERMISSIONS DES FICHIERS STATIQUES :
#    sudo chmod -R 755 /home/utilisateur/ProjetStage/data/django/staticfiles/
#    sudo chmod -R 755 /home/utilisateur/ProjetStage/data/django/media/
#
# 3. CERTIFICAT SSL :
#    - Générer avec : sudo certbot certonly --nginx -d votre_domaine.com
#    - Les chemins par défaut : /etc/letsencrypt/live/votre_domaine.com/
#    - Renouvellement automatique avec Certbot
#
# 4. TESTER LA CONFIGURATION :
#    sudo nginx -t
#
# 5. RECHARGER NGINX :
#    sudo systemctl reload nginx
#
# 6. CONSULTER LES LOGS :
#    sudo tail -f /var/log/nginx/projetstage_error.log
#
# ═══════════════════════════════════════════════════════════════════════════
